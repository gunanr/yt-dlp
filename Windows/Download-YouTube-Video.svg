<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Red rounded square background -->
  <rect width="128" height="128" rx="28" ry="28" fill="#FF0000"/>
  
  <!-- White play button container -->
  <rect x="20" y="32" width="88" height="64" rx="14" ry="14" fill="#FFFFFF"/>
  
  <!-- Large bold red play triangle -->
  <polygon points="44,48 44,80 84,64" fill="#FF0000"/>
  
  <!-- Bold white "YouTube" text above the play button -->
  <text x="64" y="24" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">YouTube</text>
  
  <!-- Bold white "Download" text below -->
  <text x="64" y="115" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Download</text>
</svg>
